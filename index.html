<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>Running Event Dashboard</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e5e7eb;--blue:#2563eb;--navy:#0f172a;--green:#16a34a;--amber:#d97706;--red:#dc2626;--gray:#64748b}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}button{font:inherit}.wrap{max-width:1040px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#0f172a 0%,#173475 55%,#2563eb 100%);color:#fff;padding:26px;border-radius:26px;box-shadow:0 16px 40px #0f172a24}.hero-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.hero h1{margin:0 0 7px;font-size:clamp(30px,6vw,50px);line-height:1.05}.hero p{margin:0;color:#dbeafe}.version{font-size:11px;font-weight:800;letter-spacing:.08em;padding:7px 10px;border:1px solid #ffffff30;background:#ffffff14;border-radius:999px;white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}.stat{padding:14px;border-radius:16px;background:#ffffff16;border:1px solid #ffffff20}.stat b{display:block;font-size:22px;line-height:1.15}.stat span{font-size:11px;color:#dbeafe}.toolbar{margin:18px 0 0;background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 8px 24px #0f172a0b}.toolrow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.filters{display:flex;gap:7px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:#fff;color:#475467;padding:8px 11px;border-radius:999px;font-size:12px;font-weight:800;cursor:pointer}.filter:hover{border-color:#94a3b8}.filter.active{background:#111827;color:#fff;border-color:#111827}.filter.status-active{background:#e0e7ff;color:#3730a3;border-color:#c7d2fe}.today{font-size:12px;color:#475467;font-weight:700}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:24px 2px 12px}.section-title h2{margin:0;font-size:20px}.section-count{font-size:12px;font-weight:800;background:#eef2ff;color:#3730a3;padding:7px 10px;border-radius:999px}.events{display:grid;gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 10px 28px #0f172a0c;transition:.18s ease}.card:hover{transform:translateY(-1px);box-shadow:0 14px 34px #0f172a13}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.card h3{margin:0;font-size:21px}.sub{margin-top:4px;color:var(--muted);font-size:13px}.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.badge{white-space:nowrap;font-size:11px;font-weight:900;padding:7px 10px;border-radius:999px}.ongoing{background:#dcfce7;color:#166534}.upcoming{background:#dbeafe;color:#1d4ed8}.completed{background:#e2e8f0;color:#334155}.canceled{background:#fee2e2;color:#991b1b}.target{background:#fef3c7;color:#92400e}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.item{background:#f8fafc;border:1px solid #eef2f7;border-radius:13px;padding:11px;min-height:64px}.item small{display:block;text-transform:uppercase;letter-spacing:.065em;color:var(--muted);font-size:10px;margin-bottom:5px}.item b{font-size:14px;line-height:1.35}.tba{color:#b45309}.note{margin-top:12px;background:#fffbeb;border-left:4px solid #f59e0b;border-radius:10px;padding:12px 14px;font-size:13px}.missing{margin-top:10px;color:#92400e;font-size:12px;font-weight:800}.archive .card{opacity:.78}.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:18px;padding:28px;text-align:center;color:#64748b}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.actions button{border:0;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:#111827;color:#fff}.secondary{background:#e5e7eb;color:#111827}.footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px;padding:26px 4px 8px}.legend{display:flex;gap:10px;flex-wrap:wrap}.dot:before{content:'•';font-size:18px;vertical-align:-1px;margin-right:4px}.dot.green:before{color:var(--green)}.dot.blue:before{color:var(--blue)}.dot.gray:before{color:var(--gray)}.dot.red:before{color:var(--red)}
@media(max-width:760px){.wrap{padding:10px}.hero{padding:20px;border-radius:19px}.hero-top{display:block}.version{display:inline-block;margin-top:14px}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.toolrow{align-items:flex-start}.today{width:100%;margin-top:3px}.head{flex-direction:column}.badges{justify-content:flex-start}.card h3{font-size:19px}}
@media print{body{background:#fff}.toolbar,.actions,.version{display:none}.hero{box-shadow:none}.card{box-shadow:none;break-inside:avoid}.wrap{max-width:none}.archive{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="hero-top">
      <div><h1>🏃 Running Event Dashboard</h1><p>Event lintas tahun, race pack, countdown, dan detail yang masih TBA.</p></div>
      <span class="version">VERSION 2</span>
    </div>
    <div class="stats">
      <div class="stat"><b id="activeStat">—</b><span>Event aktif</span></div>
      <div class="stat"><b id="nextRaceStat">—</b><span>Next physical event</span></div>
      <div class="stat"><b id="nextRpcStat">—</b><span>Next known RPC</span></div>
      <div class="stat"><b id="tbaStat">—</b><span>Detail TBA</span></div>
    </div>
  </section>

  <section class="toolbar">
    <div class="toolrow">
      <div>
        <div class="filters" id="yearFilters"></div>
        <div class="filters" id="statusFilters" style="margin-top:8px"></div>
      </div>
      <div class="today" id="today"></div>
    </div>
  </section>

  <div class="section-title"><h2>Event aktif</h2><span class="section-count" id="activeCount"></span></div>
  <div class="events" id="events"></div>

  <div class="actions">
    <button class="primary" onclick="copyWA()">📋 Copy recap WhatsApp</button>
    <button class="secondary" onclick="window.print()">🖨️ Print / Save PDF</button>
  </div>

  <div class="section-title"><h2>Arsip</h2><span class="section-count" id="archiveCount"></span></div>
  <div class="events archive" id="archive"></div>

  <div class="footer">
    <span>Dashboard v2 • URL tetap sama untuk 2026, 2027, dan seterusnya.</span>
    <span class="legend"><span class="dot green">Current</span><span class="dot blue">Future</span><span class="dot gray">Past</span><span class="dot red">Canceled</span></span>
  </div>
</div>
<script>
const events=[
 {name:'Banana Fuel Run 2026',year:2026,category:'5K • Virtual Run',type:'virtual',start:'2026-09-01',end:'2026-10-15',date:'1 Sep – 15 Okt 2026',time:'Fleksibel',location:'Virtual / lokasi bebas',rpc:'Tidak ada RPC onsite',rpcDate:null,pack:'Medal finisher • E-BIB • E-certificate',note:'Selesaikan dan submit aktivitas sebelum periode challenge berakhir.'},
 {name:'Gading Fun Run 2026 / Lotte',year:2026,category:'Fun Run 4–5K',type:'physical',start:'2026-09-27',end:null,date:'Minggu, 27 Sep 2026',time:'Kumpul 05.30 • Event 06.00–12.00 WIB',location:'Main Lobby, Lotte Mart Kelapa Gading',rpc:'TBA / belum diumumkan',rpcDate:null,pack:'Jersey • BIB • Finisher Medal • Goodies',note:'Harga di poster: Rp300.000. Pantau info Race Pack Collection dari panitia.',missing:['Race Pack Collection']},
 {name:'ANLENE 10.000 Langkah / Osteorun',year:2026,category:'Osteorun 5K',type:'physical',start:'2026-11-01',end:null,date:'Minggu, 1 Nov 2026',time:'Flag-off 05.30 WIB',location:'Plaza Tenggara, GBK Jakarta',rpc:'30–31 Okt 2026 • Lobby Ground Senayan Park',rpcDate:'2026-10-30',pack:'BIB bertiming chip • Medal finisher',note:'Cut-off Osteorun 5K: 90 menit. Usahakan ambil race pack lebih awal.'},
 {name:'Disney Run Jakarta 2026',year:2026,category:'5K',type:'physical',start:'2026-11-14',end:null,date:'Sabtu, 14 Nov 2026',time:'Flag-off 05.30 WIB',location:'ICE BSD City – Parkir Timur B & C',rpc:'11–13 Nov 2026 • 10.00–20.00 • The Breeze BSD',rpcDate:'2026-11-11',pack:'Jersey • BIB • Tote bag • Special merchandise',note:'Datang lebih awal di race day. Target utama: finish nyaman.',target:true},
 {name:'Pesta LeLARIan 2026 / Indosat 5G',year:2026,category:'5.5K',type:'physical',start:'2026-09-19',end:null,date:'19 Sep 2026',time:'—',location:'MNP Campus, Gading Serpong',rpc:'—',rpcDate:null,pack:'—',note:'Event dibatalkan dan tidak lagi masuk jadwal aktif.',canceled:true}
];

let selectedYear=localStorage.getItem('runDashYear')||'2026';
let selectedStatus=localStorage.getItem('runDashStatus')||'all';
const today=new Date(); today.setHours(12,0,0,0);
const years=[...new Set([2026,2027,...events.map(e=>e.year)])].sort();

function dateObj(s,end=false){if(!s)return null;const d=new Date(s+'T12:00:00');if(end)d.setHours(23,59,59,999);return d}
function statusOf(e){if(e.canceled)return 'canceled';const s=dateObj(e.start),en=dateObj(e.end||e.start,true);if(today<s)return 'upcoming';if(today>en)return 'completed';return 'ongoing'}
function statusLabel(s){return ({ongoing:'CURRENT',upcoming:'FUTURE',completed:'PAST',canceled:'CANCELED'})[s]}
function countdown(e){const s=dateObj(e.start),en=dateObj(e.end||e.start,true),sval=statusOf(e);if(sval==='canceled')return 'Dibatalkan';if(sval==='completed')return 'Selesai';if(sval==='ongoing'&&e.end){return 'Sedang berlangsung • '+Math.max(0,Math.ceil((en-today)/86400000))+' hari tersisa'}if(sval==='ongoing')return 'Hari ini';return Math.ceil((s-today)/86400000)+' hari lagi'}
function isTba(text){return /TBA|belum diumumkan/i.test(text||'')}
function card(e){const s=statusOf(e);const rpcClass=isTba(e.rpc)?'tba':'';return `<article class="card"><div class="head"><div><h3>${e.name}</h3><div class="sub">${e.category} • ${e.year}</div></div><div class="badges"><span class="badge ${s}">${statusLabel(s)}</span>${e.target?'<span class="badge target">TARGET UTAMA</span>':''}</div></div><div class="grid"><div class="item"><small>Race / Challenge</small><b>${e.date}</b></div><div class="item"><small>Waktu</small><b>${e.time}</b></div><div class="item"><small>Lokasi</small><b>${e.location}</b></div><div class="item"><small>Race Pack Collection</small><b class="${rpcClass}">${e.rpc}</b></div><div class="item"><small>Benefit / Race Pack</small><b>${e.pack}</b></div><div class="item"><small>Countdown</small><b>${countdown(e)}</b></div></div><div class="note">${e.note}</div>${e.missing?.length?`<div class="missing">⚠️ Belum lengkap: ${e.missing.join(', ')}</div>`:''}</article>`}
function passesFilters(e){const y=selectedYear==='all'||String(e.year)===selectedYear;const s=selectedStatus==='all'||statusOf(e)===selectedStatus;return y&&s}
function renderFilters(){document.getElementById('yearFilters').innerHTML=['all',...years].map(y=>`<button class="filter ${String(y)===selectedYear?'active':''}" onclick="setYear('${y}')">${y==='all'?'Semua Tahun':y}</button>`).join('');document.getElementById('statusFilters').innerHTML=['all','ongoing','upcoming','completed','canceled'].map(s=>`<button class="filter ${s===selectedStatus?'status-active':''}" onclick="setStatus('${s}')">${s==='all'?'Semua Status':statusLabel(s)}</button>`).join('')}
function render(){renderFilters();const active=events.filter(e=>!['completed','canceled'].includes(statusOf(e))).filter(passesFilters).sort((a,b)=>dateObj(a.start)-dateObj(b.start));const archived=events.filter(e=>['completed','canceled'].includes(statusOf(e))).filter(passesFilters).sort((a,b)=>dateObj(b.start)-dateObj(a.start));document.getElementById('events').innerHTML=active.length?active.map(card).join(''):'<div class="empty">Belum ada event aktif untuk filter ini. Cocok untuk mulai isi event 2027 nanti 😄</div>';document.getElementById('archive').innerHTML=archived.length?archived.map(card).join(''):'<div class="empty">Belum ada event di arsip untuk filter ini.</div>';document.getElementById('activeCount').textContent=active.length+' event';document.getElementById('archiveCount').textContent=archived.length+' event';updateStats()}
function setYear(y){selectedYear=String(y);localStorage.setItem('runDashYear',selectedYear);render()}
function setStatus(s){selectedStatus=s;localStorage.setItem('runDashStatus',selectedStatus);render()}
function updateStats(){const activeAll=events.filter(e=>!['completed','canceled'].includes(statusOf(e)));const nextPhysical=activeAll.filter(e=>e.type==='physical'&&dateObj(e.start)>=today).sort((a,b)=>dateObj(a.start)-dateObj(b.start))[0];const nextRpc=activeAll.filter(e=>e.rpcDate&&dateObj(e.rpcDate)>=today).sort((a,b)=>dateObj(a.rpcDate)-dateObj(b.rpcDate))[0];const tba=activeAll.reduce((n,e)=>n+(e.missing?.length||0),0);document.getElementById('activeStat').textContent=activeAll.length;document.getElementById('nextRaceStat').textContent=nextPhysical?new Date(nextPhysical.start+'T12:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short'}):'—';document.getElementById('nextRpcStat').textContent=nextRpc?new Date(nextRpc.rpcDate+'T12:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short'}):'—';document.getElementById('tbaStat').textContent=tba}
function copyWA(){const visible=events.filter(e=>!['canceled'].includes(statusOf(e))).filter(e=>selectedYear==='all'||String(e.year)===selectedYear).sort((a,b)=>dateObj(a.start)-dateObj(b.start));const title=selectedYear==='all'?'RUN EVENT PLAN':'RUN EVENT PLAN '+selectedYear;const lines=['🏃‍♂️ *'+title+'*',''];visible.forEach((e,i)=>{lines.push(`${i+1}. *${e.name}*`,`📅 ${e.date}`,`🏁 ${e.category}`,`⏰ ${e.time}`,`📍 ${e.location}`,`📦 RPC: ${e.rpc}`,`🔖 ${statusLabel(statusOf(e))}`,'')});navigator.clipboard.writeText(lines.join('\n')).then(()=>alert('Recap sudah dicopy. Tinggal paste ke WhatsApp 👍')).catch(()=>alert('Browser tidak mengizinkan clipboard. Silakan copy manual.'))}

document.getElementById('today').textContent='Hari ini: '+today.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});render();
</script>
</body>
</html>
